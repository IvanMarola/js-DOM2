<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея фотографій</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <h1>Фотогалерея Picsum</h1>
      <p class="desc">Практична робота з Fetch API та маніпуляціями DOM</p>
    </header>

    <!-- Основний контейнер для картинок -->
    <main id="gallery" class="gallery"></main>

    <!-- Текстове повідомлення для користувача -->
    <p id="status-text" class="status-text"></p>

    <!-- Панель з 4 обов'язковими кнопками за ТЗ -->
    <div class="controls">
      <button id="load-btn" class="btn btn-primary">Завантажити ще 4 картинки</button>
      <button id="reverse-btn" class="btn btn-neutral">Перевернути галерею</button>
      <button id="delete-btn" class="btn btn-neutral">Видалити останню картинку</button>
      <button id="clear-btn" class="btn btn-danger">Очистити галерею</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
